name: Build and deploy Vue frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "learnwithadel_vue/**"
      - ".github/workflows/deploy-pages.yml"
      - "DEPLOYMENT.md"
  pull_request:
    branches:
      - main
    paths:
      - "learnwithadel_vue/**"
      - ".github/workflows/deploy-pages.yml"
      - "DEPLOYMENT.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: learnwithadel_vue/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install frontend dependencies
        working-directory: learnwithadel_vue
        run: npm ci

      - name: Build production frontend
        working-directory: learnwithadel_vue
        env:
          VUE_APP_API_URL: ${{ vars.VUE_APP_API_URL }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: learnwithadel_vue/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
